[package]
name = "astroctl-drivers"
description = "Concrete device drivers: skywatcher, gphoto2 and the permanent simulators."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# One feature per driver family, so a field node built for real hardware does not carry code for
# devices it will never see (M1-T02 acceptance: "behind a `simulator` feature flag"). Making the
# dependencies optional too is what keeps the claim checkable: with `--no-default-features` this
# crate links nothing at all, which a build demonstrates rather than a comment promising it.
#
# On by default for the reason astroctl-ipc's `supervisor` is: `scripts/check.sh` compiles, lints
# and tests default features only, and a driver no gate ever looks at is the worse failure.
#
# `gphoto2` and `libgphoto2` are two features for one driver, and the split is the whole reason
# the driver is testable. M2-T02 found that `libgphoto2_sys` 1.2.3 runs `pkg-config` **and
# `bindgen`** in its build script: on a machine without `libgphoto2-dev` the crate does not fail
# to link, it fails to *compile*. A single feature that pulled in the binding would therefore
# have to be off by default (CI has no libgphoto2) — and `scripts/check.sh` builds default
# features only, so the entire camera driver would be invisible to all six gates. That is the
# failure the `simulator` note above already calls the worse one.
#
# So the split is by what needs the C library, not by what is "the driver":
#
#   `gphoto2`    the driver — camera thread, command channel, per-operation timeouts, the wedge
#                protocol, the gvfs claim diagnosis, and the `CamOps` seam. Pure Rust, no system
#                library, **on by default**, so every gate compiles, lints and tests it.
#   `libgphoto2` the `CamOps` implementation that talks to the real camera. Needs
#                `libgphoto2-dev` at build time, so it is **off by default** and the field node
#                enables it (ADD §5.6 rule 1: only the binaries may name this crate, so the
#                deployable is the only thing that can make that choice).
#
# What is untested on CI is therefore exactly the PTP call layer, which no CI machine could
# exercise anyway for want of a camera. Everything above it runs against a mock `CamOps`.
#
# `skywatcher` is the third family and takes the same shape for the same reason. M3-T01 gave it a
# body that needed *nothing* — the codec is pure functions over bytes and strings — and M3-T02 has
# now added the transport above it, which is where the split appears:
#
#   `skywatcher` the codec **and** the serial task: two lanes, the biased drain, per-request
#                timeout and retry, the heartbeat counter, the exchange loop, the write gate, the
#                VID/PID table and the candidate ranking. Every one of those is pure Rust over a
#                `Wire` trait, **on by default**, and tested against the in-crate mock port.
#   `serialport` the one `Wire` implementation that owns a real fd. Needs `libudev-dev` at build
#                time (see the workspace manifest), so it is **off by default** and the field node
#                enables it — the same rule ADD §5.6 applies to `libgphoto2`.
#
# What is untested on CI is therefore exactly the fd layer, which needs a mount. Note that this
# moved `skywatcher` from "no external dependency at all" to `tokio` + `async-trait` + `tracing`:
# a request/response queue is a runtime object and cannot be otherwise. The codec's own claim
# survives unchanged and is still checkable, now by asking about the codec rather than the family:
# `cargo tree -p astroctl-drivers -e normal --no-default-features -F skywatcher --depth 1` lists
# the transport's dependencies, and nothing under `src/skywatcher/codec/` imports any of them.
[features]
default = ["simulator", "gphoto2", "skywatcher"]
simulator = ["dep:async-trait", "dep:chrono", "dep:jpeg-encoder", "dep:tokio"]
gphoto2 = ["dep:async-trait", "dep:chrono", "dep:rustix", "dep:tokio", "dep:tracing"]
libgphoto2 = ["gphoto2", "dep:gphoto2"]
skywatcher = ["dep:async-trait", "dep:thiserror", "dep:tokio", "dep:tracing"]
serialport = ["skywatcher", "dep:serialport"]

[dependencies]
# ADD §5.6 rule 1: these two, and nothing else internal, ever.
astroctl-core = { workspace = true }
astroctl-hal = { workspace = true }

# The HAL's traits are `async-trait`, so an implementation of one has to be too.
async-trait = { workspace = true, optional = true }
# `time` is the whole simulator: sleeps for the injected serial latency and `Instant` for the
# axis clock, which under `tokio::time::pause` makes a 90-second slew testable in milliseconds.
# `sync` is the semaphore standing in for the one serial cable — the thing an `emergency_stop`
# must be able to jump (SDD §5.2.4), and the oneshot the camera's own thread replies over.
# `rt` arrived with M1-T06: live view and the guide camera's free-running acquisition are
# producer loops the *driver* owns (`start_continuous` hands back a stream and returns), and a
# loop with nobody to await it is a spawned task. Still no runtime is started here — drivers run
# on the caller's.
#
# `macros` arrived with M3-T02, for one construct and one reason: `tokio::select!` with `biased`
# is what makes SDD §5.2.4's priority lane a property of the code rather than a hope. Hand-rolling
# the poll order over two `Receiver`s would mean hand-rolling cancellation safety on the losing
# branch, on the path an emergency stop travels.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"], optional = true }
# Frame timestamps: `CaptureResult.started_at`, `LiveViewFrame.captured_at`, `DATE-OBS` in the
# FITS header. The workspace pins it without `clock` (SDD §2 confines local time to the UI).
chrono = { workspace = true, optional = true }
# The 8-bit rendition beside every 16-bit frame, and every live-view frame. See the workspace
# manifest for why this encoder and not `image` or `mozjpeg`.
jpeg-encoder = { workspace = true, optional = true }
# The camera driver's spans carry the OS thread the libgphoto2 call ran on — which is how
# "no blocking call escapes the camera thread" (SDD §5.3.1, T-ISO-1) is observable in a log
# rather than only in a test. First `tracing` dependency in this crate; the simulators need none
# because nothing they do is invisible from the outside.
tracing = { workspace = true, optional = true }
# The libgphoto2 binding itself — see `[features]` above for why it is optional and why that is
# not merely a size optimisation.
gphoto2 = { workspace = true, optional = true }
# The Synta codec's two error enums (M3-T01). `thiserror` rather than hand-written `Display`
# impls for the same reason `astroctl-core` uses it: the error text is the diagnostic a field log
# carries, and a derive keeps it next to the variant it describes instead of in a `match` arm
# three screens away that nobody updates.
thiserror = { workspace = true, optional = true }
# `USBDEVFS_RESET` on the camera's device node — the USB reset SDD §5.3.1 asks the recovery path
# to attempt (M2-T04). Already a workspace dependency for `statvfs` in the two binaries, so this
# adds a crate edge rather than a dependency; `rustix::ioctl` needs no feature beyond the default
# backend, which is why no feature is named here. See `gphoto2::usbreset` for why the ioctl and
# not `authorized` or unbind/rebind: it is the only one of the three that a non-root process can
# ever perform, and the operator running the recovery test is exactly such a process.
rustix = { workspace = true, optional = true }
# The mount's cable, and the only thing in this crate that opens one. Optional and off by default
# because it needs `libudev-dev` at build time — see the workspace manifest for why udev is kept
# rather than switched off, and `[features]` above for what stays testable without it.
serialport = { workspace = true, optional = true }

[dev-dependencies]
# `test-util` is load-bearing rather than convenient: it is what makes `tokio::time::pause`
# available, and without it every timing test in this crate would be a real-time sleep and a
# source of CI flakes. `macros`/`rt` run the tests themselves.
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
# Independent readers for the two formats this crate writes — a round-trip through our own code
# would prove only that it is self-consistent. See the workspace manifest.
fitsrs = { workspace = true }
zune-jpeg = { workspace = true }
# The hardware run's *software cable pull*. `tests/hardware_r10.rs` issues `USBDEVFS_RESET` on the
# camera's own device node to make the device vanish and re-enumerate for real — the same event a
# yanked cable produces, with no hands and no root (the node is `plugdev`-writable). The driver
# has its own copy of this behind the `gphoto2` feature; the test does not reach into it, because
# the reset under test must be the *driver's* decision, not one the test performed for it.
rustix = { workspace = true }

[lints]
workspace = true
