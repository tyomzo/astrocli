[package]
name = "astroctl-ipc"
description = "Worker IPC protocol: versioned messages and supervision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# ADD §5.6 rule 6 forbids the field binary a dependency on a GPU/ML runtime *or on worker
# process management*, and exempts this crate on the grounds that it is protocol definitions,
# "which are inert and cheap". `protocol` keeps that true: serde types and a line codec, no
# tokio, no `std::process`. Everything that spawns, kills or restarts a child lives behind
# `supervisor`, so "the field binary carries no worker process management" is something a build
# can demonstrate (`default-features = false`) rather than something a reviewer has to promise.
#
# It is on by default because `scripts/check.sh` compiles, lints and tests default features
# only. A supervisor behind an off-by-default flag is a supervisor no gate ever looks at, which
# is a worse outcome than the one the flag defends against.
[features]
default = ["supervisor"]
supervisor = ["dep:tokio", "dep:tracing"]

[dependencies]
astroctl-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Supervision only. `process` is the reason this is optional at all; `sync` carries the job
# queue and the status watch, `time` the ping cadence and the restart backoff.
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# The supervision tests drive real child processes, so they need a real multi-threaded runtime;
# a current-thread runtime would serialize the stdout reader task against the test body.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
