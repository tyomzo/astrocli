[package]
name = "astroctl-field"
description = "Field-node binary: axum API, WS hub, stack proxy and PWA serving."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
astroctl-core = { workspace = true }

# M0-T05 (binary bootstrap). Features are chosen here, not in the workspace manifest (see the
# comment on `[workspace.dependencies]`).
axum = { workspace = true }
# `signal` for the SIGTERM handler of SDD §7; `rt-multi-thread` because §7 requires an explicitly
# sized multi-threaded runtime and `macros` only for `select!`/`#[tokio::test]`.
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
hyper-util = { workspace = true }
# M0-T06: the PWA bundle, embedded when `frontend/dist` exists (see build.rs).
include_dir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
rustix = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = { workspace = true }

[lints]
workspace = true
