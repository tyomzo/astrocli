[package]
name = "astroctl-field"
description = "Field-node binary: axum API, WS hub, stack proxy and PWA serving."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
astroctl-core = { workspace = true }
# M1-T03: the mount facade holds `Arc<dyn MountDevice>` and builds it from the registry.
astroctl-hal = { workspace = true }
# M1-T03: ADD §5.6 rule 1 — "nothing above the HAL depends on a concrete driver except the
# registry", and the crate that *populates* the registry is a binary. This is that binary; it
# names `SimulatorMountFactory` in one function and nowhere else.
astroctl-drivers = { workspace = true }
# M1-T05: the facade the API sees *is* `SafeMount` (ADR-11). This is the only crate that builds
# one, because it is the only one that has both the driver and the operator's configuration.
astroctl-safety = { workspace = true }
# M1-T08: the capture flow writes through the frame store rather than to the filesystem — the
# id reservation, the disk gate and the sha256 all live there (SDD §5.5), and this binary is
# where the camera driver and the session layout meet.
astroctl-session = { workspace = true }
# M1-T11: the durable upload queue of SDD §5.10. The crate owns the journal, the multipart POST
# and the drain loop; this binary owns the `frame.saved` subscription, because recovering from a
# missed event means reconciling against the frame store and the frame store is held here.
astroctl-transfer = { workspace = true }
# M1-T09: the decode/stretch/encode of SDD §5.7. It is pure — bytes in, bytes out — so this
# binary owns everything about *when* a preview is rendered (the depth-1 queue, the blocking
# pool, the cache path, the announcement) and the crate owns only what the image looks like.
astroctl-pipeline = { workspace = true }

# M0-T05 (binary bootstrap). Features are chosen here, not in the workspace manifest (see the
# comment on `[workspace.dependencies]`).
#
# `ws` (M1-T03) is what SDD §5.8.3's hub is built on. It pulls tokio-tungstenite, sha1 and
# base64 — the RFC 6455 handshake and framing, which are not something to hand-roll under an
# operator's telescope.
axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true }
getrandom = { workspace = true }
# `signal` for the SIGTERM handler of SDD §7; `rt-multi-thread` because §7 requires an explicitly
# sized multi-threaded runtime and `macros` only for `select!`/`#[tokio::test]`.
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
hyper-util = { workspace = true }
# M1-T14: the WS proxy dials its own connection with `hyper::client::conn::http1` rather than the
# pooled client — an upgraded connection is single-use, and `with_upgrades` is what lets the 101
# escape the HTTP state machine with the socket attached.
hyper = { workspace = true }
# M0-T06: the PWA bundle, embedded when `frontend/dist` exists (see build.rs).
include_dir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
rustix = { workspace = true }
# M0-T09: TLS termination (SEC-05). The field node is the only process that must be up for the
# system to work, so the certificate lives here rather than behind a proxy (ADD §4).
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
x509-parser = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
# M1-T03: a real WebSocket client for the §5.8.3 and §4.5 acceptance criteria.
#
# `oneshot` cannot complete an upgrade — it drives a `Service` and never gives the connection
# back — so snapshot-on-connect, ticket replay and "no ticket is refused" are only testable
# against a bound port with something that speaks RFC 6455. This is the same version axum's `ws`
# feature already pulls in, so it costs no new compilation, and using a *different*
# implementation from the server's is what makes the handshake a real test rather than one
# library agreeing with itself.
tokio-tungstenite = { version = "0.29" }
futures-util = { workspace = true }

[lints]
workspace = true
