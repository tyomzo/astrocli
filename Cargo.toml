[workspace]
resolver = "2"
members = ["crates/*"]

# `spikes/` holds throwaway hardware-spike code (M2-T01, M3-T01) with its own `[workspace]`
# stanzas. It is deliberately never built by `cargo build --workspace`.
#
# `tests/` holds the M1-T16 end-to-end suite, which is the opposite of throwaway and excluded for
# different reasons. Three of them, and they are worth writing down because "why is the e2e suite
# not a workspace member" is the first question anyone will have:
#
#   1. It cannot run without Docker and two built images. `cargo test --workspace` is the gate
#      (scripts/check.sh) and has to stay hermetic and offline; a member whose tests need a
#      container engine would make the gate's meaning depend on the machine it ran on.
#   2. ADD §5.6 lists exactly fourteen crates and scripts/check-deps.sh asserts that set. A
#      fifteenth member is a violation there by construction — correctly, because the e2e suite
#      is not part of the architecture it tests.
#   3. Membership would put reqwest and tokio-tungstenite into the root Cargo.lock, and both
#      Dockerfiles build `--workspace` in their dependency layer from that lock. The product
#      images would then compile the test client's dependency tree, and every Dockerfile would
#      need a fifteenth `COPY … Cargo.toml` line to make the workspace load at all.
#
# The usual cost of exclusion — never being linted, as spikes/ is not — is paid off in
# scripts/check.sh instead: the fmt and clippy gates name this manifest explicitly.
exclude = ["spikes", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Toolchain floor. Pinned exactly in rust-toolchain.toml; see
# docs/evidence/dependency-survey-2026-07-29.md for why 1.94 is not enough.
rust-version = "1.97"
license = "MIT"
authors = ["Artiom Klimov"]
publish = false

# Shared dependency versions. Every crate refers to these with `{ workspace = true }` so the
# whole tree moves versions in one place (ADD §5.6, SDD §2).
[workspace.dependencies]
# --- internal crates (paths only; nothing here is published) ---
astroctl-core = { path = "crates/astroctl-core" }
astroctl-hal = { path = "crates/astroctl-hal" }
astroctl-drivers = { path = "crates/astroctl-drivers" }
astroctl-safety = { path = "crates/astroctl-safety" }
astroctl-session = { path = "crates/astroctl-session" }
astroctl-pipeline = { path = "crates/astroctl-pipeline" }
astroctl-solver = { path = "crates/astroctl-solver" }
astroctl-planning = { path = "crates/astroctl-planning" }
astroctl-guiding = { path = "crates/astroctl-guiding" }
astroctl-transfer = { path = "crates/astroctl-transfer" }
astroctl-llm = { path = "crates/astroctl-llm" }
astroctl-ipc = { path = "crates/astroctl-ipc" }

# --- external, versions per docs/evidence/dependency-survey-2026-07-29.md ---
# Features are deliberately left to the consuming crate; only the version is shared.
tokio = { version = "1.53" }
axum = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
thiserror = { version = "2" }
tracing = { version = "0.1" }
# `bundled` compiles SQLite from vendored C source — no system libsqlite3 on the Pi.
rusqlite = { version = "0.40", features = ["bundled"] }

# Deny-by-default lint policy, inherited by every crate via `[lints] workspace = true`.
# Living here rather than in a CI flag means a local `cargo clippy` and CI agree by
# construction; CI additionally passes `-D warnings` for rustc's own lints.

# --- added by M0-T02/T03/T04 ---
# The `detail` object of the API error envelope (SDD §4.2) and the `data` payload of every
# event (§4.3) are free-form JSON, so `Value` reaches into astroctl-core itself.
serde_json = { version = "1" }
# Time (SDD §2: all persisted timestamps are UTC RFC 3339 with milliseconds). `chrono` rather
# than `time` because SDD §4.3 specifies `Event.ts: DateTime<Utc>` literally. `default-features
# = false` + `now`: we deliberately do NOT enable `clock`, which would pull `iana-time-zone` for
# local-timezone support the backbone must never use — SDD §2 confines local time to UI rendering.
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "now"] }
# YAML for the operator-facing config (PRD §8.1/§8.2). `serde_yaml` is deprecated and
# unmaintained and `serde_yml` has since been deprecated too; `yaml_serde` is the YAML
# organization's maintained continuation of dtolnay's crate (github.com/yaml/yaml-serde),
# API-compatible, so `deny_unknown_fields` and the dotted key path already embedded in its
# error messages both carry over unchanged (SDD §4.4).
yaml_serde = { version = "0.10.4" }

# --- added by M0-T05 (binary bootstrap) ---
# Structured logging to console + `server.log_dir` (SDD §2 "Logging", task M0-T05 scope).
# `tracing-appender` is what makes the file half non-blocking: its writer hands lines to a
# background thread, so an SD card stalling on the Pi cannot block a runtime worker mid-capture.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = { version = "0.2" }
# The `/stack/*` reverse proxy (ADR-07). hyper-util's legacy client is the low-level HTTP client
# that axum 0.8's own hyper 1.x stack already pulls in, so proxying costs no new transitive tree
# and — unlike a high-level client — lets the request body stream straight through without ever
# being buffered in RAM. No TLS: the two nodes talk over the VPN (PRD §7, ADD §5.5).
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
# Constant-time bearer-token comparison (SDD §4.5). The tokens are hashed first and the 32-byte
# digests compared, so the comparison is constant-time in the *token length* too — `ct_eq` on the
# raw strings returns early on a length mismatch and leaks it. `sha2` is also what M1's frame
# checksums (SDD §5.10.1, §5.11.2) will use, so the version belongs here rather than in one crate.
sha2 = { version = "0.10" }
subtle = { version = "2" }
# Free-space reporting for `/api/system/health` (REL-12 thresholds). A safe wrapper over
# `statvfs`; the alternative is hand-written `unsafe` around `libc` in two binaries.
rustix = { version = "1", features = ["fs"] }
# Test-only: `ServiceExt::oneshot` drives a built `Router` without binding a port, which is how
# the auth/route-metadata tests assert on real responses rather than on handler return values.
tower = { version = "0.5", features = ["util"] }

# --- added by M1-T01 (HAL traits) ---
# What makes the HAL traits usable as `Arc<dyn MountDevice>` (SDD §5.1, §2). Native
# async-fn-in-trait is stable on this toolchain but is not dyn-compatible, and every consumer
# above the HAL holds a trait object rather than a driver type (ADD §5.6 rule 1) — so the boxing
# is not a stopgap for a missing feature, it is the feature. One heap allocation per device call
# is invisible against a 16 ms serial round trip (SDD §5.2.4).
async-trait = { version = "0.1" }

# --- added by M0-T06 (frontend pipeline) ---
# The built PWA compiled into the field binary (ARC-02: "deployment is a single service"). Chosen
# over `rust-embed` because it is a plain proc macro over a directory with no runtime, no feature
# matrix and no debug-mode filesystem fallback — the last of which would make the binary behave
# differently in development from production in exactly the layer this is meant to make boring.
# Absence of `frontend/dist` is handled by astroctl-field's build.rs, not by this crate.
include_dir = { version = "0.7" }

# --- added by M0-T09 (TLS termination on the field node, SEC-05) ---
# `ring` rather than the default `aws-lc-rs` provider. Both are pure enough, but aws-lc-rs needs
# cmake and a bindgen-capable toolchain at build time, which is a poor trade on the Pi of SDD §5.9
# — and `ring` already carries every suite this needs, including the ECDSA P-256 that Let's
# Encrypt issues by default. `default-features = false` is what drops aws-lc-rs; `tls12` stays
# because a browser is not the only client (curl, a shell script, an older Android WebView).
# `rustls` itself is not named here: it arrives through tokio-rustls, which re-exports it, so
# there is exactly one place the version can be set.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
# PEM → DER for the certificate chain and the private key. Used rather than hand-rolling the
# base64/label parsing because it handles all three key encodings — PKCS#1, PKCS#8 and **SEC1**.
# The last one matters: an ECDSA key from acme.sh is `-----BEGIN EC PRIVATE KEY-----`, and a
# loader that only knows PKCS#8 fails on the only certificate this deployment actually has.
rustls-pemfile = { version = "2.2" }
# `notAfter` out of the certificate, for SEC-07's expiry reporting. rustls parses certificates
# only as far as it needs to make a handshake work and exposes no validity accessor, so reading
# the expiry needs a real X.509 parser. Pure Rust, no OpenSSL.
x509-parser = { version = "0.18" }

# --- added by M1-T03 (WS hub, ws-ticket) ---
# `StreamExt::split` on axum's `WebSocket`. The hub gives the read half and the write half to
# separate tasks so that neither ever holds the other up — a client stalled on a write must not
# stop the reader from answering pings, and the reader must not sit inside a `select!` whose
# other branch could cancel a partially-read frame. Already in the tree transitively; naming it
# is what makes `split` callable. `default-features = false` drops the executor and the async-await
# macro machinery this does not use.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# The ws-ticket's randomness (SDD §4.5: "cryptographically random, at least 128 bits, generated
# by the server"). `getrandom` rather than `rand`: this needs exactly one thing — bytes from the
# OS CSPRNG — and `rand` would bring a PRNG, a distribution framework and a seeding policy, none
# of which should be anywhere near a security token. Already in the tree under `ring`.
getrandom = { version = "0.2" }

# --- added by M1-T11 (transfer agent: the sending half of ADR-05) ---
# The request/response types and `Bytes`/`Frame`. The client itself is `hyper-util`'s legacy
# client, already in the tree for the `/stack/*` proxy (ADR-07), so the upload costs no second
# HTTP stack. Deliberately not `reqwest`: it would bring a TLS stack, a cookie jar and a second
# connection pool to send one multipart POST over a VPN that is already the encrypted layer
# (PRD §7, ADD §5.5) — and its multipart body buffers, which is the one thing a 25 MB frame on a
# Pi must not do.
hyper = { version = "1", features = ["client", "http1"] }
# `StreamBody` — the sender's half of §5.11.2's "never whole in RAM". The frame is read off the
# SD card in chunks and handed to the socket as it goes, so peak memory is one chunk rather than
# one frame.
http-body-util = { version = "0.1" }

# --- added by M1-T06 (simulator camera: FITS + JPEG renditions) ---
# The JPEG half of the simulator's RAW+JPEG pair and every live-view frame (CAM-05). Chosen over
# `image` and over `mozjpeg`: `image` is a whole codec framework where one encoder is wanted, and
# `mozjpeg` wraps a C library — a system dependency on the Pi for a file format the field node
# writes several times a second. `jpeg-encoder` has **no dependencies at all**, which is the
# property that matters most for something in the capture path.
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
# Test-only, both of them, and both deliberately *different implementations* from the ones under
# test: a round-trip through the code that produced the bytes proves only self-consistency.
#
# `fitsrs` is what the M1-T06 acceptance criterion's `fitsio` read-back becomes when the system
# cfitsio is not taken on (PRD §7 pins `fitsio` 0.21.10, which links `libcfitsio-dev`). Pure
# Rust, from CDS — the group behind Aladin and SIMBAD — so "a standard tool opens it" is a claim
# with an observatory's parser behind it rather than a second reading of our own writer.
fitsrs = { version = "0.4.1" }
# ...and the same argument for the JPEG side: `zune-jpeg` decodes what `jpeg-encoder` encoded.
zune-jpeg = { version = "0.5.15" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Async-safety (SDD §2, M0-T07).
#
# These live here rather than as `-D` flags in CI on purpose: the gate then fires on a plain
# `cargo clippy` on any developer's machine, and cannot be lost by a CI workflow forgetting to
# pass a flag. A lint that only exists in one YAML file is a lint one edit away from silence.
#
# Both catch the same class of bug — a guard held across an `.await`, which parks the guard on a
# runtime worker and can deadlock every other task that wants it. On the field node that worker
# pool is `min(2, cores-2)` (SDD §7), so "every other task" is a very small number of tasks away
# from being the whole node.
#
# They are not sufficient. `scripts/check.sh` adds a grep for the blocking calls these cannot
# see, and T-ISO-1 is the behavioural backstop for everything neither catches.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
